[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-engine"
version = "0.1.0"
description = "Automated failure-reconstruction and causal minimization engine for distributed systems"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Mr-Nobody-Anonymous", email = "bmx310712@gmail.com"}
]
keywords = [
    "distributed-systems",
    "causal-inference",
    "delta-debugging",
    "fault-injection",
    "debugging",
    "concurrency",
    "partial-order-reduction",
    "chaos-engineering",
    "failure-reconstruction",
    "root-cause-analysis",
    "distributed-tracing",
    "reproducibility",
    "opentelemetry",
    "consensus",
    "raft",
    "microservices",
    "software-testing",
    "reliability"
]
dependencies = [
    "networkx>=3.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "rich>=13.0.0",
    "click>=8.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
phantom = "phantom.cli:main"

[tool.setuptools.packages.find]
include = ["phantom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:asyncio"
