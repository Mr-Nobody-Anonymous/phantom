name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Coverage (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        exclude:
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint and formatting sanity
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 phantom tests --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run unit & integration tests with coverage
      run: |
        pytest --cov=phantom --cov-report=term --cov-report=xml --cov-fail-under=80

    - name: Benchmark correctness check
      run: |
        python -m phantom.cli benchmark --group a --algo phantom --no-plot

  build:
    name: Package Build & Clean Install
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Build wheel and sdist
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Test clean install from wheel
      run: |
        pip install dist/*.whl
        phantom --version
